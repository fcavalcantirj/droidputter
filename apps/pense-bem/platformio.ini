; DROIDPUTTER overlay: builds Pense-Bem UNCHANGED from its own repo against the patched libs in lib/.
[platformio]
src_dir = /Users/fcavalcanti/dev/m5/cardputter-pense-pem/src
lib_extra_dirs = ../../shim/lib

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
lib_deps =
    m5stack/M5Unified@0.2.20
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I /Users/fcavalcanti/dev/m5/cardputter-pense-pem/src
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DM5GFX_BOARD=24
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPB_SERIAL_DEBUG=1
    -DDROIDPUTTER=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

[env:m5cardputer-bench]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_BENCH=1 -DDROIDPUTTER_TXBUF=32768

[env:m5cardputer-bench-8192]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_BENCH=1 -DDROIDPUTTER_TXBUF=8192

[env:m5cardputer-bench-32768]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_BENCH=1 -DDROIDPUTTER_TXBUF=32768

[env:m5cardputer-bench-65536]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_BENCH=1 -DDROIDPUTTER_TXBUF=65536

; Cardputer ADV hardware, but M5GFX's autodetect() is bypassed for Panel_Droidputter
; (dp_panel.h): the TFT stays dark, the phone (via the Mac receiver) is the only screen.
; Real proof that the display-tee path works with no physical panel driving it.
[env:m5cardputer-virtual]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_VIRTUAL=1

; Bare ESP32-S3 devkit target (no M5 hardware at all): build-only proof that any
; M5GFX/M5Unified app compiles for a board with no display and no physical keyboard
; matrix. DROIDPUTTER_KEYS_VIRTUAL is reserved for the keyboard-injection task (15);
; passing it here is a no-op today but keeps the env name/flags matching spec.json.
[env:esp32-s3-devkitc-1-virtual]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
lib_deps =
    m5stack/M5Unified@0.2.20
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I /Users/fcavalcanti/dev/m5/cardputter-pense-pem/src
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPB_SERIAL_DEBUG=1
    -DDROIDPUTTER=1
    -DDROIDPUTTER_VIRTUAL=1
    -DDROIDPUTTER_KEYS_VIRTUAL=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800
