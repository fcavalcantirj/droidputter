; DROIDPUTTER overlay: gps-demo shows droidputter_gps() (dp_gps.h ring) is the
; only app-side change a UART-based GPS app needs to read the phone's GPS.
[platformio]
lib_extra_dirs = ../../shim/lib

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
lib_deps =
    m5stack/M5Unified@0.2.20
    mikalhart/TinyGPSPlus@1.1.0
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DM5GFX_BOARD=24
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDROIDPUTTER=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; Cardputer ADV hardware, but M5GFX's autodetect() is bypassed for
; Panel_Droidputter (dp_panel.h): the TFT stays dark, the phone is the only
; screen -- same overlay pattern proved by apps/pense-bem's virtual env.
[env:m5cardputer-virtual]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_VIRTUAL=1
