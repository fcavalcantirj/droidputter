; DROIDPUTTER shim: host-testable core (dp_frame, dp_rle, ...) run under `pio test -e native`,
; separate from the ESP-side apps/*/platformio.ini builds. lib/DroidputterShim is picked up
; automatically as a private library (default lib_dir = lib, relative to this file).
[env:native]
platform = native
build_flags = -std=c++17
test_framework = unity
