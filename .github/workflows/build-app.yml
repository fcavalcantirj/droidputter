# On-demand shim build of any catalog repo ("recompile on the fly", spike S3): rebuilds a Cardputer app
# from its upstream GitHub source against the droidputter shim (tools/overlay.py + shim/apply.sh) on a
# GitHub runner -- no Mac involved -- and uploads the flashable parts as ONE artifact. The `env` input picks
# the PlatformIO env of the generated overlay: m5cardputer (Cardputer ADV, the real TFT teed) or
# m5cardputer-virtual (a bare ESP32-S3, the phone is the only screen); one run builds one env.
#
#   gh workflow run build-app.yml -f repo=wisnc/stellar-map -f name=stellar-map [-f ref=<branch|tag|sha>] [-f env=m5cardputer-virtual]
#
# Publishing the parts to a release / the catalog is a LATER step: it needs the founder's decision on
# tags and releases (rolling tag vs orphan branch vs LauncherHub upload) -- this workflow never tags.
name: build-app

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "upstream GitHub repo, owner/name (e.g. wisnc/stellar-map)"
        required: true
        type: string
      name:
        description: "overlay dir name under apps/ (e.g. stellar-map)"
        required: true
        type: string
      ref:
        description: "optional upstream git ref: branch, tag or full 40-hex commit sha (default: the repo's default branch)"
        required: false
        default: ""
        type: string
      env:
        description: "PlatformIO env of the overlay: m5cardputer (Cardputer ADV) or m5cardputer-virtual (bare ESP32-S3, phone-only)"
        required: false
        default: "m5cardputer"
        type: string
      request_id:
        description: "opaque id set by the build proxy so it can find this run again (shows in the run name)"
        required: false
        default: ""
        type: string
      shim:
        description: "shim commit the proxy expects (informational, shows in the run name)"
        required: false
        default: ""
        type: string

# The proxy (proxy/, deployed on Vercel) correlates its request with this run by the run name.
run-name: "build ${{ inputs.repo }}@${{ inputs.ref || 'HEAD' }} env=${{ inputs.env }} shim=${{ inputs.shim || '?' }} req=${{ inputs.request_id || '-' }}"

permissions:
  contents: read

concurrency:
  group: build-app-${{ inputs.name }}-${{ inputs.env }}-${{ inputs.request_id || 'manual' }}
  cancel-in-progress: false

env:
  ESPRESSIF32_VERSION: "6.12.0"   # the platform pin in tools/overlay.py ENV_TEMPLATE (arduino-esp32 2.0.17)
  PLATFORMIO_VERSION: "6.1.19"    # the PlatformIO Core the Mac builds use, kept equal for sha256 comparisons

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPO: ${{ inputs.repo }}
      NAME: ${{ inputs.name }}
      REF: ${{ inputs.ref }}
      ENV: ${{ inputs.env }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad repo: $REPO"; exit 1; }
          [[ "$NAME" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "bad name: $NAME"; exit 1; }
          [[ -z "$REF" || "$REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "bad ref: $REF"; exit 1; }
          [[ "$ENV" == "m5cardputer" || "$ENV" == "m5cardputer-virtual" ]] || { echo "bad env: $ENV (m5cardputer | m5cardputer-virtual)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO core dir (platform, toolchain, framework, global libs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            !~/.platformio/.cache
          key: ${{ runner.os }}-platformio-espressif32-${{ env.ESPRESSIF32_VERSION }}-pio${{ env.PLATFORMIO_VERSION }}

      - name: Install PlatformIO
        run: |
          python -m pip install --quiet "platformio==${PLATFORMIO_VERSION}"
          pio --version

      - name: Overlay + build (tools/overlay.py --build)
        run: |
          set -o pipefail
          args=("$REPO" --name "$NAME" --env "$ENV" --build)
          [ -n "$REF" ] && args+=(--ref "$REF")
          python3 tools/overlay.py "${args[@]}" | tee overlay.out

      - name: Collect artifact
        run: |
          B="apps/$NAME/.pio/build/$ENV"
          mkdir -p dist
          cp "$B/bootloader.bin" "$B/partitions.bin" "$B/firmware.bin" dist/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" dist/
          tail -n 1 overlay.out > dist/build.json
          (cd dist && sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin | tee SHA256SUMS && ls -l)

      # Named <name>-<env> (the ADV artifact keeps its old <name>-m5cardputer name); the proxy selects it by
      # that exact name and never touches the -elf one below.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ inputs.env }}
          path: dist/
          if-no-files-found: error
          # The artifact is a build CACHE the proxy streams from, not a distribution channel: a week is plenty.
          retention-days: 7

      # The linked ELF (20-40 MB) rides in its OWN artifact (<name>-<env>-elf): the proxy picks the run's
      # <name>-<env> artifact and unzips it whole in memory, so the flashable zip stays small; the ELF is for the
      # Mac's xtensa-esp32s3-elf-addr2line when the phone's PanicSniffer reports a Backtrace (Pigtail IWDT triage).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ inputs.env }}-elf
          path: apps/${{ inputs.name }}/.pio/build/${{ inputs.env }}/firmware.elf
          if-no-files-found: warn
          retention-days: 7

      - name: Build log tail (on failure)
        if: failure()
        run: |
          echo "::group::overlay.py output"; cat overlay.out 2>/dev/null || echo "(none)"; echo "::endgroup::"
          tail -n 200 "apps/$NAME/.pio/overlay-build.log" 2>/dev/null || echo "no apps/$NAME/.pio/overlay-build.log"
