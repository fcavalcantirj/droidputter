; DROIDPUTTER overlay: builds the M5Cardputer library's own inputText example
; UNCHANGED from shim/upstream/ against the patched libs in lib/ -- proof that
; ANY open-source Cardputer app rebuilds against the shim, not just Pense-Bem.
[platformio]
src_dir = ../../shim/upstream/M5Cardputer/examples/Basic/keyboard/inputText
lib_extra_dirs = ../../shim/lib

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
lib_deps =
    m5stack/M5Unified@0.2.20
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DM5GFX_BOARD=24
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDROIDPUTTER=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; ESP32-C5-DevKitC-1 (chip ESP32-C5 rev v1.2, RISC-V, 8MB flash no PSRAM, MAC
; 10:bd:a3:df:18:14 per INVENTORY.md) -- build-only toolchain probe. arduino-esp32
; needs core >= 3.x for C5 silicon; this repo is pinned to espressif32@6.12.0
; (arduino-esp32 2.0.17) for every other env, and that platform version ships no
; esp32-c5-* board defs at all (confirmed: absent from
; ~/.platformio/platforms/espressif32/boards/, present only in the separately
; installed pioarduino fork used by other, unrelated projects on this machine).
; board id below is the closest official match available anywhere on this
; machine (Espressif ESP32-C5-DevKitC-1); the real unit is 8MB flash / no PSRAM,
; none of the locally available C5 board defs match that exactly, and it does
; not matter -- board resolution fails before flash size is ever read (see
; progress.txt for the actual `pio run -e esp32-c5` error under 6.12.0).
; Hardware caveats when a human next has this board in hand (from INVENTORY.md):
; J5 current-measurement jumper must be bridged with a cap or the chip is dead on
; BOTH ports despite the power LED lighting; use the native USB port (enumerates
; as /dev/cu.usbmodem*), NOT the CP2102N UART port (/dev/cu.usbserial-*); esptool
; must be >= 5.3.0, e.g. ~/Library/Arduino15/packages/esp32/tools/esptool_py/5.3.0/esptool.
[env:esp32-c5]
platform = espressif32@6.12.0
board = esp32-c5-devkitc-1
framework = arduino
board_build.mcu = esp32c5
lib_deps =
    m5stack/M5Unified@0.2.20
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDROIDPUTTER=1
    -DDROIDPUTTER_VIRTUAL=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; M5Stack StickS3 (SKU K150, ESP32-S3-PICO-1-N8R8, board_M5StickS3=26 in M5GFX).
; Flags mirror the arduino-cli FQBN proven on this exact hardware in
; /Users/fcavalcanti/dev/felipe/home-automations/devices/m5sticks3/:
; esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi
; -- PSRAM is OPI, not quad (PSRAM=enabled/qio_qspi boots but reports psram=0 on this
; board, measured on hardware in that project; qio_opi is the one that works).
[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = true
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
lib_deps =
    m5stack/M5Unified@0.2.20
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DM5GFX_BOARD=26
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDROIDPUTTER=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; Same StickS3 hardware, but M5GFX's autodetect() is bypassed for Panel_Droidputter
; (dp_panel.h, shim task 13): the StickS3's own ST7789 stays dark, the phone (via the
; Mac receiver) is the only screen -- same "board with no display" proof task 13 built
; for the Cardputer ADV, now for the second board family this repo targets.
[env:m5stack-sticks3-virtual]
extends = env:m5stack-sticks3
build_flags = ${env:m5stack-sticks3.build_flags} -DDROIDPUTTER_VIRTUAL=1
