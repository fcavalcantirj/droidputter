; DROIDPUTTER overlay: builds the M5Cardputer library's own inputText example
; UNCHANGED from shim/upstream/ against the patched libs in lib/ -- proof that
; ANY open-source Cardputer app rebuilds against the shim, not just Pense-Bem.
[platformio]
src_dir = ../../shim/upstream/M5Cardputer/examples/Basic/keyboard/inputText
lib_extra_dirs = ../../shim/lib

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
lib_deps =
    m5stack/M5Unified@0.2.20
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DM5GFX_BOARD=24
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDROIDPUTTER=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; M5Stack StickS3 (SKU K150, ESP32-S3-PICO-1-N8R8, board_M5StickS3=26 in M5GFX).
; Flags mirror the arduino-cli FQBN proven on this exact hardware in
; /Users/fcavalcanti/dev/felipe/home-automations/devices/m5sticks3/:
; esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi
; -- PSRAM is OPI, not quad (PSRAM=enabled/qio_qspi boots but reports psram=0 on this
; board, measured on hardware in that project; qio_opi is the one that works).
[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = true
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
lib_deps =
    m5stack/M5Unified@0.2.20
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DM5GFX_BOARD=26
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDROIDPUTTER=1
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800
