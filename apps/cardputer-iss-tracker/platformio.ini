; DROIDPUTTER overlay generated by tools/overlay.py -- builds adammelancon/cardputer-iss-tracker UNCHANGED from
; apps/_src/cardputer-iss-tracker against the patched libs in lib/ (shim/apply.sh) + DroidputterShim.
; Upstream env used for lib_deps/build_flags: [env:m5stack-cardputer]. Regenerate with:
;   python3 tools/overlay.py adammelancon/cardputer-iss-tracker --name cardputer-iss-tracker
[platformio]
src_dir = /Users/fcavalcanti/dev/droidputter/apps/_src/cardputer-iss-tracker/src
lib_extra_dirs =
    ../../shim/lib
    /Users/fcavalcanti/dev/droidputter/apps/_src/cardputer-iss-tracker/lib

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
lib_deps =
    m5stack/M5Unified@0.2.20
    greiman/SdFat @ ^2.2.3
    https://github.com/sparkfun/SparkFun_SGP4_Arduino_Library.git
    adafruit/Adafruit NeoPixel @ ^1.12.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DM5GFX_BOARD=24
    -DDROIDPUTTER=1
    -I /Users/fcavalcanti/dev/droidputter/apps/_src/cardputer-iss-tracker/include
    -I include
    -Wall
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; Same app, TFT dark, the phone is the only screen (Panel_Droidputter, dp_panel.h).
[env:m5cardputer-virtual]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_VIRTUAL=1
