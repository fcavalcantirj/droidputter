; DROIDPUTTER shim: host-testable core (dp_frame, dp_rle, ...) run under `pio test -e native`,
; separate from the ESP-side apps/*/platformio.ini builds. lib/DroidputterShim is picked up
; automatically as a private library (default lib_dir = lib, relative to this file).
[env:native]
platform = native
build_flags = -std=c++17
test_framework = unity
; The shim's Arduino-only includes (M5Unified/M5GFX, behind #ifdef ARDUINO) must not pull the
; espressif32 libraries that shim/apply.sh installs into the global ~/.platformio/lib storage.
lib_ignore = M5GFX, M5Cardputer, M5Unified, IRremote
