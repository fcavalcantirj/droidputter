; DROIDPUTTER overlay generated by tools/overlay.py -- builds benbaker76/Pigtail UNCHANGED from
; apps/_src/pigtail against the patched libs in lib/ (shim/apply.sh) + DroidputterShim.
; Upstream env used for lib_deps/build_flags: [env:m5stack-stamps3]. Regenerate with:
;   python3 tools/overlay.py benbaker76/Pigtail --name pigtail
[platformio]
src_dir = /Users/fcavalcanti/dev/droidputter/apps/_src/pigtail/src
lib_extra_dirs =
    ../../shim/lib

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
board_build.partitions = /Users/fcavalcanti/dev/droidputter/apps/_src/pigtail/partitions.csv
lib_deps =
    m5stack/M5Unified@0.2.20
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7
    bblanchon/ArduinoJson@^7.4.2
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    -DARDUINO_M5Stack_StampS3
    -DLV_CONF_INCLUDE_SIMPLE
    -std=gnu++2a
    -Wl,-zmuldefs
    -Os
    -I /Users/fcavalcanti/dev/droidputter/apps/_src/pigtail/include
    -DM5GFX_BOARD=24
    -DDROIDPUTTER=1
    -Wall
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; Same app, TFT dark, the phone is the only screen (Panel_Droidputter, dp_panel.h).
[env:m5cardputer-virtual]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_VIRTUAL=1
