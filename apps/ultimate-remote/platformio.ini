; DROIDPUTTER overlay generated by tools/overlay.py -- builds geo-tp/Ultimate-Remote UNCHANGED from
; apps/_src/ultimate-remote against the patched libs in lib/ (shim/apply.sh) + DroidputterShim.
; Upstream env used for lib_deps/build_flags: [env:m5stack-stamps3]. Regenerate with:
;   python3 tools/overlay.py geo-tp/Ultimate-Remote --name ultimate-remote
[platformio]
src_dir = /Users/fcavalcanti/dev/droidputter/apps/_src/ultimate-remote/src
lib_extra_dirs =
    ../../shim/lib

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram = false
lib_deps =
    m5stack/M5Unified@0.2.20
    fastled/FastLED@^3.3.3
    symlink://../../shim/lib/DroidputterShim
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DM5GFX_BOARD=24
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDROIDPUTTER=1
    -Wall
    -I ../../shim/lib/DroidputterShim/src
monitor_speed = 115200
upload_speed = 460800

; Same app, TFT dark, the phone is the only screen (Panel_Droidputter, dp_panel.h).
[env:m5cardputer-virtual]
extends = env:m5cardputer
build_flags = ${env:m5cardputer.build_flags} -DDROIDPUTTER_VIRTUAL=1
