# Debug APK on a GitHub runner: `:core` tests + kover gate + `:app:assembleDebug`, artifact `app-debug`.
# Exists because the executor's Mac may be memory-starved (2026-09-04: 26 GB of swap in use, Gradle crawling);
# the phone is installed from this artifact with `adb install -r`. Never tags, never publishes.
name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "apps/catalog.json"
      - "apps/verdicts.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, coverage gate, static gate, debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :core:koverVerify :app:assembleDebug
          bash gates.sh
          ls -la app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
